# jarvis-install: .
[project]
name = "jarvis"
version = "0.1.0"
description = "J.A.R.V.I.S., the local voice assistant of PROJECT RIMA (RIMA-01)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10",
    "ollama>=0.6.3",
    "pint>=0.26.1",
    "piper-tts>=1.8.0",
    "sounddevice>=0.5.6",
]
