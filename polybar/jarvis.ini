# jarvis-install: polybar
# polybar/jarvis.ini  |  PROJECT RIMA, RIMA-01
# The J.A.R.V.I.S. status icon for Polybar. To use it, add this line near the top
# of your Polybar config (~/.config/polybar/config.ini), before the first [section]:
#     include-file = /home/tony/rima/jarvis/polybar/jarvis.ini
# then add "jarvis" to your bar's modules-right (or modules-left / modules-center).
#
#   ● JARVIS       blue   ready          ◉ LISTENING   red    listening to you
#   ◉ THINKING     amber  working        ◉ SPEAKING    blue   answering
#   ◌ JARVIS       amber  starting up    ○ JARVIS      grey   off
#   ✕ JARVIS       red    crashed (click to restart)
#
#   left click     talk (starts voice mode if it's off)
#   middle click   show today's conversation (jarvis-history)
#   right click    start / stop voice mode

[module/jarvis]
type = custom/script
exec = ~/.local/bin/jarvis-status
tail = true
click-left = ~/.local/bin/jarvis-ptt &
click-middle = ~/.local/bin/jarvis-history &
click-right = ~/.local/bin/jarvis-status --toggle &
format-padding = 1
